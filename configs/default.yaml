seed: 42

benchmark:
  num_questions_per_cell: 20  # per graph type per reasoning level

models:
  gpt2_small:
    name: "gpt2"
    display_name: "GPT-2 Small (124M)"
    params: "124M"
    quantize: false
  gpt2_large:
    name: "gpt2-large"
    display_name: "GPT-2 Large (774M)"
    params: "774M"
    quantize: false
  phi2:
    name: "microsoft/phi-2"
    display_name: "Phi-2 (2.7B)"
    params: "2.7B"
    quantize: true

model_max_seq_len:
  gpt2_small: 512
  gpt2_large: 512
  phi2: 2048

prompting_strategies:
  - zero_shot
  - few_shot
  - chain_of_thought
  - causal_chain

probing:
  num_samples: 200
  cv_folds: 5
  n_control_repeats: 5

output_dir: "./output_llm"
